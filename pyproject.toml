[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-stellar"
version = "0.1.0"
description = "x402 payments on Stellar for Python: pay from agents, charge from FastAPI, verify and settle yourself."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emre Kadir Dağdelen" }]
keywords = ["x402", "stellar", "soroban", "payments", "http-402", "ai-agents", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "stellar-sdk>=17,<18",
    "httpx>=0.27",
]

[project.optional-dependencies]
server = ["starlette>=0.37", "fastapi>=0.110"]
sdk = ["x402>=2.26,<3"]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "fastapi>=0.110", "uvicorn>=0.29", "x402>=2.26,<3"]

[project.urls]
Homepage = "https://github.com/dagdelenemre/x402-stellar"
Source = "https://github.com/dagdelenemre/x402-stellar"
Issues = "https://github.com/dagdelenemre/x402-stellar/issues"
Security = "https://github.com/dagdelenemre/x402-stellar/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
