name: Testnet demo

# Runs both demos against Stellar testnet with fresh Friendbot accounts
# and writes the settled transaction links to the job summary.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - ".github/workflows/testnet-demo.yml"

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Testnet and Friendbot are public services that are sometimes slow or down;
    # a failure here should not block a pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[demo,sdk]"
      - name: Standalone demo
        run: python examples/demo.py | tee demo.log
      - name: Official x402 SDK demo
        run: python examples/sdk_demo.py | tee sdk_demo.log
      - name: Summary
        if: always()
        run: |
          {
            echo "## Testnet settlements"
            echo
            for f in demo.log sdk_demo.log; do
              [ -f "$f" ] || continue
              link=$(grep -oE 'https://stellar.expert/explorer/testnet/tx/[0-9a-f]{64}' "$f" | head -1)
              echo "- \`${f%.log}\`: ${link:-no transaction}"
            done
          } >> "$GITHUB_STEP_SUMMARY"
